<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата и Навигация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <a href="#" class="logo-link"><img src="logo.png" alt="Логотип"></a>
        <nav>
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="#" class="menu-toggle">Турниры</a>
                    <ul class="dropdown">
                        <li><a href="#">Москва</a></li>
                        <li><a href="#">Не Сочи</a></li>
                        <li><a href="#">гуляй до ночи</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
    </header>



    <nav class="side-nav">
        <ul>
            <li><a href="#"><img src="edit.png" alt="">Редактировать</a></li>
            <li><a href="#"><img src="favorites.png" alt="">Избранное</a></li>
            <li><a href="#"><img src="history.png" alt="">История</a></li>
            <li><a href="#"><img src="security.png" alt="">Безопасность</a></li>
            <li><a href="#"><img src="settings.png" alt="">Настройки</a></li>
        </ul>
    </nav>

    <main>
        <form class="pay-form" method="POST" action="/pay">
            <label for="card-num">Номер карты</label>
            <input type="text" id="card-num" name="card-num" placeholder="ХХХХ ХХХХ ХХХХ ХХХХ" inputmode="numeric" autocomplete="cc-number" maxlength="19" required>

            <label for="card-exp">Срок действия</label>
            <input type="text" id="card-exp" name="card-exp" placeholder="ММ/ГГ" inputmode="numeric" autocomplete="cc-exp" maxlength="5" required>

            <label for="card-name">Имя и фамилия владельца карты</label>
            <input type="text" id="card-name" name="card-name" placeholder="IVAN IVANOV" autocomplete="cc-name" required>

            <button type="submit">Оплатить</button>
        </form>
    </main>

</body>
</html>
